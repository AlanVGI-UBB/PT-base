services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: puente-lsch-backend:dev
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - ASR_PROVIDER=stub
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_WS_URL: ws://localhost:8000
        VITE_API_URL: http://localhost:8000
    image: puente-lsch-frontend:dev
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped