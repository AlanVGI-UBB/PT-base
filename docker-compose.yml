services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: puente-lsch-backend:dev
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - ASR_PROVIDER=stub
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_WS_URL: ""
        VITE_API_URL: ""
    image: puente-lsch-frontend:dev
    ports:
      - "443:443"
      - "80:80"
    environment:
      - CERT_HOST=${CERT_HOST:-localhost}
    depends_on:
      - backend
    restart: unless-stopped

  lsch_tunnel:
    image: cloudflare/cloudflared:latest
    container_name: lsch_tunnel
    profiles:
      - cloudflare
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      backend:
        condition: service_started
      frontend:
        condition: service_started
