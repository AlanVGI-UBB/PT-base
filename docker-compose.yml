services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: puente-lsch-backend:dev
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # En compose se inyecta la URL del backend accesible desde el navegador
        VITE_WS_URL: ws://localhost:8000/ws/echo
    image: puente-lsch-frontend:dev
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped